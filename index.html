<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Campus Food List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff8ed;
        }

        header {
            background-color: #8b3a2b;
            color: white;
            padding: 25px 50px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 5px 0 0;
        }

        main {
            width: 80%;
            margin: 40px auto;
        }

        .controls {
            background-color: #ffe8c7;
            padding: 20px;
            border-left: 5px solid #8b3a2b;
            margin-bottom: 25px;
        }

        .controls h2 {
            margin-top: 0;
            color: #8b3a2b;
        }

        input {
            padding: 10px;
            width: 200px;
            border: 1px solid #b98b68;
            border-radius: 4px;
        }

        button {
            padding: 10px 16px;
            border: none;
            background-color: #8b3a2b;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }

        button:hover {
            background-color: #63291f;
        }

        .all-button {
            background-color: #d57b35;
        }

        .all-button:hover {
            background-color: #b96326;
        }

        #message {
            color: #b52c2c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #d57b35;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ead6c5;
        }

        tr:hover {
            background-color: #fff3df;
        }

        .price {
            font-weight: bold;
            color: #8b3a2b;
        }
    </style>
</head>

<body>

    <header>
        <h1>Campus Food List</h1>
    </header>

    <main>

        <div class="controls">

            <h2>Find a Food</h2>

            <input type="number" id="foodId" placeholder="Enter Food ID">

            <button onclick="searchFood()">Search</button>

            <button class="all-button" onclick="loadFoods()">Show All</button>

            <p id="message"></p>

        </div>

        <table>

            <thead>
                <tr>
                    <th>Food ID</th>
                    <th>Food Name</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody id="tableContent"></tbody>

        </table>

    </main>

    <script>
        async function loadFoods() {
            const response = await fetch("/api/foods");
            const foods = await response.json();

            const table = document.getElementById("tableContent");

            table.innerHTML = "";

            foods.forEach(food => {
                table.innerHTML += `
                    <tr>
                        <td>${food.id}</td>
                        <td>${food.name}</td>
                        <td class="price">${food.price}</td>
                    </tr>
                `;
            });
        }

        async function searchFood() {
            const id = document.getElementById("foodId").value;
            const table = document.getElementById("tableContent");
            const message = document.getElementById("message");

            if (id === "") {
                message.innerHTML = "Enter a Food ID first.";
                return;
            }

            const response = await fetch("/api/foods/" + id);
            const food = await response.json();

            table.innerHTML = "";
            message.innerHTML = "";

            if (response.status === 404) {
                message.innerHTML = "Food not found.";
                return;
            }

            table.innerHTML = `
                <tr>
                    <td>${food.id}</td>
                    <td>${food.name}</td>
                    <td class="price">${food.price}</td>
                </tr>
            `;
        }
    </script>

</body>
</html>
